[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ad-banner-creative-generator"
version = "0.6.3"
description = "Plugin-host desktop tool for generating ad and banner creatives"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ad-banner-creative maintainers" }]
dependencies = [
    "Pillow>=10.3",
    "pydantic>=2.7",
    "tomli>=2.0; python_version < '3.11'",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
ad-banner-gen = "core.host:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "contracts*", "handlers*", "services*", "models*", "utils*", "config*", "extensions*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"